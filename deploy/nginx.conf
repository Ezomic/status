# Installed at /etc/nginx/sites-available/status on the prod droplet, symlinked
# into sites-enabled. The TLS and port 80 redirect blocks are added by certbot
# on first issue, so this file is the pre-certbot shape.

server {
    listen 80;
    listen [::]:80;
    server_name status.thijssensoftware.nl;
    root /home/deploy/status/public;
    index index.php;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_log  /var/log/nginx/status-error.log error;
    access_log /var/log/nginx/status-access.log;

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* { deny all; }
}
