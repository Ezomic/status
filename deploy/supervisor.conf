; Installed at /etc/supervisor/conf.d/status.conf on the prod droplet.
;
; This is what actually makes Status monitor anything: schedule:work ticks every
; minute and runs monitor:run. Without this process the app records nothing and
; only ever shows data from a manual `php artisan monitor:run`.

[program:status-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=php /home/deploy/status/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=1
redirect_stderr=true
stdout_logfile=/home/deploy/status/storage/logs/scheduler.log
